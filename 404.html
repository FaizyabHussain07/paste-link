<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | PasteLink Pro</title>
  <meta name="description" content="The page you're looking for doesn't exist or the paste has expired.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />

  <!-- Vercel Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

  
  <style>
    .not-found-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
      padding: 2rem;
    }
    .not-found-code {
      font-size: 7rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
    }
    .not-found-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 0.75rem;
    }
    .not-found-sub {
      font-size: 1rem;
      color: var(--text-2);
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .not-found-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .not-found-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>

  <header class="header">
    <a href="index.html" class="brand">
      <div class="brand-icon" style="background: none; padding: 0;">
        <img src="assets/logo.png" alt="PasteLink Logo" width="24" height="24" style="border-radius: 4px;" />
      </div>
      <span class="brand-name">PasteLink Pro</span>
    </a>
    <div class="header-right">
      <button class="icon-btn" id="themeToggle" title="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
      <a href="index.html" class="btn-ghost" style="font-size:0.82rem">+ New paste</a>
    </div>
  </header>

  <main class="main">
    <div class="not-found-wrap">
      <div class="not-found-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent); opacity: 0.8;">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
          <line x1="11" y1="8" x2="11" y2="14" />
          <line x1="8" y1="11" x2="14" y2="11" />
        </svg>
      </div>
      <div class="not-found-code">404</div>
      <h1 class="not-found-title">This paste doesn't exist</h1>
      <p class="not-found-sub">
        The page or paste you're looking for may have expired, been burned after reading, or the link might be incorrect.
      </p>
      <div class="not-found-actions">
        <a href="index.html" class="btn-primary" style="text-decoration: none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          Create New Paste
        </a>
        <a href="index.html" class="btn-ghost" style="text-decoration: none;">
          Go to Homepage
        </a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <span>© 2026 PasteLink Pro</span>
    <span class="footer-sep">·</span>
    <span>Developed by <a href="https://faizyab-hussain.vercel.app/" target="_blank" class="footer-link">Faizyab</a></span>
    <span class="footer-sep">·</span>
    <span>
      <a href="pages/about.html" class="footer-link">About</a> ·
      <a href="pages/contact.html" class="footer-link">Contact</a> ·
      <a href="pages/terms.html" class="footer-link">Terms</a> ·
      <a href="pages/privacy.html" class="footer-link">Privacy</a>
    </span>
  </footer>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const iconSun = themeToggle.querySelector('.icon-sun');
    const iconMoon = themeToggle.querySelector('.icon-moon');

    function initTheme() {
      const saved = localStorage.getItem('pl_theme');
      const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(dark ? 'dark' : 'light');
    }

    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('pl_theme', t);
      iconSun.style.display = t === 'dark' ? 'block' : 'none';
      iconMoon.style.display = t === 'dark' ? 'none' : 'block';
    }

    themeToggle.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      setTheme(cur === 'dark' ? 'light' : 'dark');
    });

    initTheme();
  </script>
</body>
</html>
